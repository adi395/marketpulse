# Tests run against an in-memory H2 database so no local Postgres is required.
spring.datasource.url=jdbc:h2:mem:marketpulse;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Dummy keys so the context loads without the real environment variables.
finnhub.api.key=test-key
finnhub.base-url=https://finnhub.io/api/v1
alphavantage.api.key=test-key
alphavantage.base-url=https://www.alphavantage.co/query
